# Throwaway Postgres for `npm run test:db`, on production's major version. Data lives in
# tmpfs and disappears with the container.
name: health-overview-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: health_overview_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d health_overview_test"]
      interval: 1s
      timeout: 3s
      retries: 30
